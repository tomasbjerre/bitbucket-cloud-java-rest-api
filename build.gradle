plugins {
	id "se.bjurr.gradle.bundle-jar" version "2.3.0"
	id "org.openapi.generator" version "7.25.0"
}

javaExtension {
	javaVersion = 17
}

formatting {
	formattingExcludedPatterns = ["src/gen/java/**"]
}

dependencies {
	api 'io.swagger:swagger-annotations:1.6.16'
	api 'jakarta.ws.rs:jakarta.ws.rs-api:4.0.0'
	api "tools.jackson.jaxrs:jackson-jaxrs-json-provider:3.2.2"
	api "org.openapitools:jackson-databind-nullable:0.2.11"
	api 'jakarta.validation:jakarta.validation-api:3.1.1'
	api 'jakarta.annotation:jakarta.annotation-api:3.0.0'
}

openApiGenerate {
	generatorName = "jaxrs-spec"
	skipOverwrite = false
	inputSpec = "$rootDir/openapi.yml".toString()
	validateSpec = false
	skipValidateSpec = true
	outputDir = "$rootDir".toString()
	apiPackage = "se.bjurr.bitbucketcloud.gen.api"
	modelPackage = "se.bjurr.bitbucketcloud.gen.model"
	configOptions = [
		interfaceOnly: "true",
		generatePom: "false",
		useJackson: "true",
		useJakartaEe: "true"
	]
}

// se.bjurr.gradle.java's own generatedSourceFolders auto-detection (which
// defaults to including src/gen/java) only wires up a folder that already
// exists on disk *at project configuration time* - see its "if
// (dir.asFile.exists())" check. On a clean checkout src/gen/java doesn't
// exist yet (it's gitignored, only openApiGenerate creates it, and that's a
// task, which only runs at execution time), so that check silently skips it
// and compileJava ends up with NO-SOURCE - which is exactly what happened to
// the 3.2.0 release, published with an empty jar.
//
// Wire it explicitly and unconditionally instead - srcDir() doesn't require
// the directory to exist yet, it's resolved lazily when the compile task
// actually runs. Use setSrcDirs() (replace), not srcDir() (append): CI runs
// spotlessJavaCheck and build as two separate Gradle invocations, and by the
// second one src/gen/java already exists on disk (left over from the
// first), so se.bjurr.gradle.java's own conditional wiring *also* fires that
// time - appending here would then register the directory twice and make
// sourcesJar fail on duplicate entries.
sourceSets {
	main {
		java {
			setSrcDirs(["$rootDir/src/gen/java"])
		}
	}
}

// openapi-generator's jaxrs-spec generator hardcodes the Jackson 2
// "com.fasterxml.jackson.databind.annotation.JsonDeserialize" import for Set
// properties and has no option to target Jackson 3's "tools.jackson" package
// (https://github.com/OpenAPITools/openapi-generator/issues/22294). Rewrite it
// in the generated sources so the generated models compile and deserialize
// against the Jackson 3 api dependencies declared above.
tasks.register('fixJackson3Imports') {
	dependsOn 'openApiGenerate'
	def genDir = "$rootDir/src/gen/java"
	inputs.dir(genDir)
	outputs.dir(genDir)
	doLast {
		fileTree(dir: genDir, include: '**/*.java').each { file ->
			def text = file.text
			def fixed = text.replace(
					'import com.fasterxml.jackson.databind.annotation.JsonDeserialize;',
					'import tools.jackson.databind.annotation.JsonDeserialize;'
					)
			if (fixed != text) {
				file.text = fixed
			}
		}
	}
}

// The Bitbucket Cloud OpenAPI spec declares some properties that redeclare a
// same-named property from a schema they're combined with via allOf - e.g.
// "pipeline_selector.type" (an enum) vs. the polymorphic base "type"
// discriminator (a string) it inherits from. The generator maps allOf to
// Java inheritance without checking the overridden property's type is
// covariant, producing generated code that doesn't compile. Patch those
// specific spots rather than changing the JSON wire format.
tasks.register('fixCovariantReturnTypeConflicts') {
	dependsOn 'fixJackson3Imports'
	def genDir = "$rootDir/src/gen/java/se/bjurr/bitbucketcloud/gen/model"
	inputs.dir(genDir)
	outputs.dir(genDir)
	doLast {
		[
			// UserLinks/TeamLinks redeclare Account's "links" property with an
			// unrelated type; making them extend AccountLinks (like the JSON
			// schemas they're modeled after already do in spirit) satisfies
			// Java's covariant-return-type rule for User/Team's getLinks().
			(file("$genDir/UserLinks.java")): [
				'public class UserLinks   {': 'public class UserLinks extends AccountLinks  {'
			],
			(file("$genDir/TeamLinks.java")): [
				'public class TeamLinks   {': 'public class TeamLinks extends AccountLinks  {'
			],
			// PipelineSelector.type (its own TypeEnum) collides with the
			// inherited ModelObject.type (the polymorphic discriminator,
			// a String). Rename PipelineSelector's Java accessors only -
			// @JsonProperty("type") is kept so the JSON key is unchanged.
			(file("$genDir/PipelineSelector.java")): [
				'public PipelineSelector type(TypeEnum type) {': 'public PipelineSelector selectorType(TypeEnum type) {',
				'public TypeEnum getType() {'                  : 'public TypeEnum getSelectorType() {',
				'public void setType(TypeEnum type) {'          : 'public void setSelectorType(TypeEnum type) {',
			],
		].each { targetFile, replacements ->
			def text = targetFile.text
			replacements.each { from, to ->
				if (!text.contains(from)) {
					throw new GradleException("Expected to find '${from}' in ${targetFile} - has the generator output changed?")
				}
				text = text.replace(from, to)
			}
			targetFile.text = text
		}
	}
}

processTestResources.dependsOn 'fixCovariantReturnTypeConflicts'
compileJava.dependsOn 'fixCovariantReturnTypeConflicts'
compileGroovy.dependsOn 'fixCovariantReturnTypeConflicts'

afterEvaluate {
	tasks.findByName("spotlessGroovyGradle")?.dependsOn("fixCovariantReturnTypeConflicts")
	tasks.findByName("spotlessJava")?.dependsOn("fixCovariantReturnTypeConflicts")
	tasks.findByName("spotlessJson")?.dependsOn("fixCovariantReturnTypeConflicts")
}

tasks.named("sourcesJar") {
	dependsOn(tasks.named("fixCovariantReturnTypeConflicts"))
}

tasks.named("javadocJar") {
	dependsOn(tasks.named("fixCovariantReturnTypeConflicts"))
}